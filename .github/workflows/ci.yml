name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BANKING_DATAOPS_DB_HOST: localhost
  BANKING_DATAOPS_DB_PORT: "5432"
  BANKING_DATAOPS_DB_NAME: banking_dataops
  BANKING_DATAOPS_DB_USER: dataops
  BANKING_DATAOPS_DB_PASSWORD: dataops_local_only
  BANKING_DATAOPS_DATA_DIR: data
  BANKING_DATAOPS_OUTPUT_DIR: output

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataops
          POSTGRES_PASSWORD: dataops_local_only
          POSTGRES_DB: banking_dataops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataops -d banking_dataops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests dashboard

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Generate seeded source data
        run: |
          python -m banking_dataops.generate_synthetic_data \
            --output-dir data \
            --customers 25 \
            --transactions 300 \
            --seed 42 \
            --anchor 2026-09-01T00:00:00+00:00

      - name: Ingest source into PostgreSQL
        run: python -m banking_dataops.ingest

      - name: Run data-quality controls
        run: python -m banking_dataops.quality_checks

      - name: Prove clean full-row source-to-target reconciliation
        run: python -m banking_dataops.reconciliation

      - name: Inject silent non-financial target mutation
        run: |
          python - <<'PY'
          from banking_dataops.db import execute_query

          execute_query(
              """
              UPDATE transactions
              SET channel = CASE WHEN channel = 'web' THEN 'branch' ELSE 'web' END
              WHERE transaction_id = (
                  SELECT MIN(transaction_id)
                  FROM transactions
              )
              """
          )
          PY

      - name: Prove canonical row reconciliation catches non-financial mutation
        shell: bash
        run: |
          if python -m banking_dataops.reconciliation; then
            echo "Expected full-row reconciliation to fail after channel mutation."
            exit 1
          fi
          echo "Non-financial mutation detected as expected."

      - name: Restore source state
        run: |
          python -m banking_dataops.ingest
          python -m banking_dataops.quality_checks
          python -m banking_dataops.reconciliation

      - name: Inject silent amount mutation
        run: |
          python - <<'PY'
          from banking_dataops.db import execute_query

          execute_query(
              """
              UPDATE transactions
              SET amount_chf = amount_chf + 1
              WHERE transaction_id = (
                  SELECT MIN(transaction_id)
                  FROM transactions
              )
              """
          )
          PY

      - name: Prove reconciliation catches amount mutation
        shell: bash
        run: |
          if python -m banking_dataops.reconciliation; then
            echo "Expected reconciliation to fail after amount mutation."
            exit 1
          fi
          echo "Amount mutation detected as expected."

      - name: Restore source state and prove final recovery
        run: |
          python -m banking_dataops.ingest
          python -m banking_dataops.quality_checks
          python -m banking_dataops.reconciliation

      - name: Verify persisted control status
        run: |
          python - <<'PY'
          from banking_dataops.monitoring import load_reconciliation_summary

          result = load_reconciliation_summary()
          assert not result.empty
          assert result.iloc[0]["status"] == "PASS"
          assert "row_mismatch_count" in result.columns
          print(result.head(3).to_string(index=False))
          PY
